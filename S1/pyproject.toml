[project]
name = "factory-control"
version = "0.1.0"
description = "S1 Factory 控制平面 (Control Plane) — DAMF REST/SSE entry point, workflow & Deployment Run orchestration, Gates, Questions, Change Requests, notifications, runtime assembly."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "DAMF S1 Team" }]
dependencies = [
    "factory-foundation==0.1.0",
    "SQLAlchemy>=2.0,<3.0",
    "psycopg[binary]>=3.1,<4.0",
    "alembic>=1.13,<2.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.0,<3.0",
    "python-ulid>=2.2,<4.0",
    # AES-256-GCM + HKDF for the operator-supplied credential store (CP-SEC-001).  Passwords stay
    # on hashlib.scrypt; this dependency exists only where a value has to be read back.
    "cryptography>=42,<46",
    "fastapi>=0.111",
    "starlette>=0.37",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "temporalio>=1.5",
    "PyYAML>=6.0",
    "typing-extensions>=4.9",
]

[project.optional-dependencies]
s3 = ["boto3>=1.34,<2.0"]
otel = ["opentelemetry-api>=1.24", "opentelemetry-sdk>=1.24"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.5",
    "boto3>=1.34,<2.0",
    "opentelemetry-api>=1.24",
    "testcontainers[postgres]>=4.0",
    "types-PyYAML",
]

[project.scripts]
factory-api = "factory_control.api:api_main"
factory-worker = "factory_control.api:worker_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/factory_control"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "unit: pure domain logic, no database",
    "assembly: public-API compatibility of the assembled S0~S4 runtime (FR-DEP-005); needs no database, so it can gate a build",
    "service: service layer against real PostgreSQL",
    "api: REST/SSE layer over ASGI transport",
    "acceptance: one test per SRS section 11 acceptance criterion",
    "temporal: Temporal time-skipping test environment",
    "e2e: end-to-end with the in-process engine",
    "m4: requires identity & permissions (milestone M4, not in MVP)",
]

[tool.coverage.run]
source = ["src/factory_control"]
branch = true

[tool.coverage.report]
fail_under = 85
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# foundation.py is the single S0 chokepoint: it imports and re-exports.
"src/factory_control/foundation.py" = ["F401"]
# REST endpoints declare injected dependencies as default arguments.
"src/factory_control/rest/*.py" = ["B008"]
"src/factory_control/rest/routes/*.py" = ["B008"]
"src/factory_control/api.py" = ["F401"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["factory_control"]

[[tool.mypy.overrides]]
module = "factory_control.foundation"
# The single S0 chokepoint re-exports the whole contract to the other layers.
implicit_reexport = true

[[tool.mypy.overrides]]
module = "factory_foundation.*"
# S0 is typed (py.typed); its own errors belong to its build, not to S1's gate.
follow_imports = "silent"

[[tool.mypy.overrides]]
module = "factory_blueprint.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "factory_intelligence.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "factory_dhis2.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "ulid.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "boto3.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "botocore.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "opentelemetry.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "temporalio.*"
ignore_missing_imports = true
