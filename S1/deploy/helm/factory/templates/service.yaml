apiVersion: v1
kind: Service
metadata:
  name: {{ include "factory.fullname" . }}
  labels:
    {{- include "factory.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    # Only the API serves HTTP: the SSE stream needs one LISTEN connection per
    # instance, so workers must not receive client traffic.
    app.kubernetes.io/component: api
    {{- include "factory.selectorLabels" . | nindent 4 }}
