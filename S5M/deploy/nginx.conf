# S5-M same-origin deployment (UM-COMP-004): one reverse proxy fronts the static H5 and /api/v1.
# Shares a host with S5 by path, or use its own server_name. SSE must not be buffered or gzipped.
server {
  listen 80;
  server_name factory.example.com;

  # Static SPA (built `dist/`). SPA fallback for deep links like /gates/{id}.
  root /usr/share/nginx/html/s5m;
  index index.html;
  location / {
    try_files $uri $uri/ /index.html;
  }

  # S1 public API + SSE, same origin.
  location /api/v1/ {
    proxy_pass http://factory-api:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Requirement documents are uploaded here. S1 accepts up to 100 MB
    # (config.default_max_upload_bytes); nginx's own 1 MB default would 413 them first.
    client_max_body_size 100m;

    # SSE: disable buffering & read timeout so events stream immediately.
    proxy_set_header Connection '';
    proxy_buffering off;
    proxy_cache off;
    chunked_transfer_encoding off;
    proxy_read_timeout 1h;
    # Never gzip text/event-stream.
    gzip off;
  }
}
