<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0e5fd6" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="description" content="元数据工厂移动端：审核 S2 生成的交付包，不向目标 DHIS2 实例发起请求。" />
    <title>元数据工厂 · 移动端</title>
    <!-- Inline glyph: a /favicon.ico request would 404 on every load and Lighthouse counts that
         as a browser error (best-practices). -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230e5fd6'/%3E%3Cpath d='M9 21V11h5v2.6h-2.3V21zM18 21v-2.6h2.3V11h-5v2.6h2.3' fill='%23fff'/%3E%3C/svg%3E" />
    <!-- Runtime config is NOT baked into the bundle so the same build stays portable (UM-COMP-004).
         `defer` keeps it off the render-blocking path; deferred classic scripts and the module
         script below still execute in document order, so window.__FACTORY_CONFIG__ exists before
         src/config/runtime.ts reads it. -->
    <script defer src="/config.js"></script>
    <style>
      /* Pre-JS skeleton. #app is empty until the bundle executes, which on a throttled mobile
         connection means a blank paint; this static markup is what First Contentful Paint sees.
         Vue replaces the container contents on mount. */
      #s5m-boot { position: fixed; inset: 0; padding: 20px 16px; background: #f5f6f7; font: 16px/1.5 system-ui, sans-serif; color: #1f2329; }
      #s5m-boot b { display: block; font-size: 18px; margin-bottom: 18px; }
      #s5m-boot i { display: block; height: 52px; margin-bottom: 10px; border-radius: 12px; background: #fff; }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="s5m-boot"><b>元数据工厂</b><i></i><i></i><i></i></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
