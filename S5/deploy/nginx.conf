# S5 ships a static bundle and is fronted by the SAME reverse proxy that serves S1's /api/v1,
# so static assets and the API are same-origin (UI-APP-008) — no CORS, and SSE works over the
# same connection. This config documents that contract; in a full deployment the ingress also
# routes /api/v1 to factory-api.
server {
    listen       80;
    server_name  _;
    root  /usr/share/nginx/html;
    index index.html;

    # config.js is regenerated per environment; never cache it.
    location = /config.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Immutable hashed assets.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA fallback (UI-IA routes are client-side).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # SSE must not be buffered and needs a long read timeout (UI-RT-001).
    location ~ ^/api/v1/workflows/.+/events$ {
        proxy_pass         http://factory-api:8000;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_buffering    off;
        proxy_cache        off;
        chunked_transfer_encoding off;
        proxy_read_timeout 1h;
        add_header X-Accel-Buffering no;
    }

    # REST proxy to S1.
    location /api/v1/ {
        proxy_pass         http://factory-api:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Requirement documents are uploaded here. S1 accepts up to 100 MB
        # (config.default_max_upload_bytes); nginx's own 1 MB default would 413 them first.
        client_max_body_size 100m;
    }
}
