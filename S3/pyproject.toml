[project]
name = "factory-intelligence"
version = "0.1.0"
description = "S3 需求与智能 (Requirements & Intelligence) — DAMF understanding and decisioning: input parsing to NRR, constrained Agent runtime, LLMProvider adapters, data-classification policy engine, Prompt/Model registries, evaluation and cost governance."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "DAMF S3 Team" }]
dependencies = [
    "factory-foundation>=0.1.0",
    "factory-blueprint>=0.1.0",
    "SQLAlchemy>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    "pydantic>=2.7,<3.0",
    "jsonschema>=4.21,<5.0",
    "referencing>=0.35",
    "python-ulid>=2.2,<4.0",
    "typing-extensions>=4.9",
    # S3's own I/O: the OpenAI-compatible adapter (AI-LLM-003) and the mandatory
    # input formats of AI-INP-002.  Declared explicitly rather than leaned on
    # transitively, because 00 doc 6.1 makes every subsystem's imports its own.
    "httpx>=0.27,<1.0",
    "openpyxl>=3.1,<4.0",
    "pypdf>=4.2,<6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.5",
    "psycopg[binary]>=3.1,<4.0",
]

[tool.uv.sources]
factory-foundation = { path = "../S0", editable = true }
factory-blueprint = { path = "../S2", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/factory_intelligence"]

# Prompt sources are shipped inside the package and registered at start-up
# (AI-REG-002); evaluation sets are shipped so a deployment can re-run them
# against a new prompt or model (AI-EVAL-002).  Neither may live in tests/,
# or a wheel would lose the prompt registry.
[tool.hatch.build.targets.wheel.force-include]
"src/factory_intelligence/prompts/source" = "factory_intelligence/prompts/source"
"src/factory_intelligence/eval/sets" = "factory_intelligence/eval/sets"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "perf: performance smoke test (skipped by default)",
    "integration: requires PostgreSQL",
]

[tool.coverage.run]
source = ["src/factory_intelligence"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
fail_under = 85

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# str/Enum and PEP-695 generics are deliberate for broad compatibility (same as S0/S2).
ignore = ["E501", "UP042", "UP046", "UP047"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = ["src", "../S0/src", "../S2/src"]
packages = ["factory_intelligence"]

[[tool.mypy.overrides]]
module = "ulid.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "jsonschema.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "referencing.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "openpyxl.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pypdf.*"
ignore_missing_imports = true

# S0 and S2 ship no usable py.typed surface for every symbol; read their real
# sources so S3 is type-checked against the actual signatures.
[[tool.mypy.overrides]]
module = ["factory_foundation.*", "factory_blueprint.*"]
follow_imports = "silent"
